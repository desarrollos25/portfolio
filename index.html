<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PortfolioSnap AI • Desarrollos25</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
  </script>
  <style>
    body { background: #0a0a0a; color: #e0e0e0; }
    .blob { animation: blob 10s infinite; }
    @keyframes blob { 0%,100% { transform: translate(0,0) scale(1); } 33% { transform: translate(30px,-50px) scale(1.1); } 66% { transform: translate(-20px,20px) scale(0.9); } }
    ::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-track { background: #111; } ::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <section class="flex-1 flex items-center justify-center relative overflow-hidden">
    <div class="absolute inset-0 -z-10">
      <div class="absolute top-20 left-20 w-96 h-96 bg-purple-600 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob"></div>
      <div class="absolute top-40 right-20 w-96 h-96 bg-blue-600 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animation-delay-2000"></div>
      <div class="absolute -bottom-20 left-1/2 w-96 h-96 bg-pink-600 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animation-delay-4000"></div>
    </div>

    <div class="text-center px-6 max-w-4xl mx-auto">
      <h1 class="text-6xl md:text-8xl font-bold mb-6 bg-gradient-to-r from-purple-400 to-pink-400 bg-clip-text text-transparent">
        Desarrollos25
      </h1>
      <p class="text-2xl md:text-4xl mb-8">Full Stack + IA Generativa</p>
      <p class="text-lg md:text-xl opacity-80 max-w-2xl mx-auto">
        Portfolio con Gemini AI integrado de forma segura
      </p>
    </div>
  </section>

  <section class="max-w-4xl mx-auto p-6">
    <div class="bg-gray-900 rounded-2xl shadow-2xl border border-gray-800">
      <div class="p-6 border-b border-gray-800">
        <h2 class="text-2xl font-bold flex items-center gap-3">
          <span class="w-3 h-3 bg-green-500 rounded-full animate-pulse"></span>
          Gemini AI • En vivo
        </h2>
      </div>

      <div id="messages" class="h-96 overflow-y-auto p-6 space-y-4"></div>

      <form id="chatForm" class="p-6 border-t border-gray-800 flex gap-3">
        <input type="text" id="prompt" placeholder="Pregúntame cualquier cosa..." class="flex-1 bg-gray-800 rounded-xl px-5 py-3 focus:outline-none focus:ring-2 focus:ring-purple-500" autocomplete="off" required />
        <button type="submit" class="bg-gradient-to-r from-purple-600 to-pink-600 px-8 py-3 rounded-xl font-semibold hover:opacity-90 transition">
          Enviar
        </button>
      </form>
    </div>
  </section>

  <footer class="text-center py-8 text-gray-500 text-sm">
    © 2025 Desarrollos25 • Deploy en Vercel • Gemini AI (proxy seguro)
  </footer>

  <script type="module">
    const messagesDiv = document.getElementById("messages");
    const form = document.getElementById("chatForm");
    const input = document.getElementById("prompt");

    function addMessage(text, isUser = false) {
      const msg = document.createElement("div");
      msg.className = `p-4 rounded-xl max-w-lg ${isUser ? "bg-purple-600 ml-auto" : "bg-gray-800"}`;
      msg.textContent = text;
      messagesDiv.appendChild(msg);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const prompt = input.value.trim();
      if (!prompt) return;

      addMessage(prompt, true);
      input.value = "";

      const typing = document.createElement("div");
      typing.className = "text-gray-500 italic";
      typing.textContent = "Gemini está escribiendo...";
      messagesDiv.appendChild(typing);

      try {
        const res = await fetch("/api/gemini", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt })
        });

        const data = await res.json();
        messagesDiv.removeChild(typing);

        if (res.ok) {
          addMessage(data.text);
        } else {
          addMessage("Error: " + (data.error || "Servidor"));
        }
      } catch (err) {
        messagesDiv.removeChild(typing);
        addMessage("Error de conexión");
      }
    });

    addMessage("¡Hola! Soy Gemini integrado de forma segura. ¿En qué te ayudo hoy?");
  </script>
</body>
</html>
